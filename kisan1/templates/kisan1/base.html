{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Kisan Asara - Your Farming Partner{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/pro_styles.css' %}">
</head>

<body class="animate-fade-in">
    {% block background_overlay %}
    {% endblock %}

    {% block content %}
    {% endblock %}

    <script src="{% static 'js/floating_particles.js' %}"></script>
    <script>
        document.querySelectorAll('.menu-container').forEach((container) => {
            const trigger = container.querySelector('button');
            if (!trigger) {
                return;
            }
            trigger.addEventListener('click', (event) => {
                event.stopPropagation();
                container.classList.toggle('is-open');
            });
        });

        document.addEventListener('click', () => {
            document.querySelectorAll('.menu-container.is-open').forEach((container) => {
                container.classList.remove('is-open');
            });
        });
    </script>
</body>

</html>
